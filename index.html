<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading | Stackly</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI, Arial, sans-serif;
}

/* ================= BACKGROUND ================= */
body{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(
    135deg,
    #ff1f1f 0%,
    #ff1f1f 50%,
    #3a3a3a 50%,
    #3a3a3a 100%
  );
  overflow:hidden;
}

/* ================= CONTAINER ================= */
.loader-wrap{
  text-align:center;
}

/* ================= LOGO IMAGE ================= */
.logo-img{
  width:180px;       /* adjust if needed */
  margin-bottom:35px;
}

/* ================= TRACK ================= */
.transport-track{
  position:relative;
  width:260px;
  height:60px;
  margin:auto;
  overflow:hidden;
}

/* TRACK LINE */
.transport-track::after{
  content:"";
  position:absolute;
  bottom:10px;
  left:0;
  width:100%;
  height:2px;
  background:rgba(255,255,255,.6);
}

/* ================= VEHICLES ================= */
.transport{
  position:absolute;
  font-size:38px;
  left:-60px;
  opacity:0;
  animation:move 3s infinite ease-in-out;
}

.flight{ animation-delay:0s; }
.train{ animation-delay:1s; }
.bus{ animation-delay:2s; }

/* ================= ANIMATION ================= */
@keyframes move{
  0%{
    transform:translateX(-80px);
    opacity:0;
  }
  10%{
    opacity:1;
  }
  50%{
    transform:translateX(150px);
    opacity:1;
  }
  90%{
    opacity:0;
  }
  100%{
    transform:translateX(260px);
    opacity:0;
  }
}

/* ================= TEXT ================= */
.loading-text{
  margin-top:22px;
  color:#ffffff;
  font-size:14px;
  letter-spacing:2px;
  opacity:.9;
}

/* ================= MOBILE ================= */
@media(max-width:480px){
  .logo-img{
    width:140px;
  }

  .transport{
    font-size:32px;
  }
}
</style>
</head>

<body>

<div class="loader-wrap">

  <!-- STACKLY LOGO IMAGE -->
  <img src="logo.webp" alt="Stackly Logo" class="logo-img">

  <!-- LOADER -->
  <div class="transport-track">
    <div class="transport flight">✈️</div>
    <div class="transport train">🚆</div>
    <div class="transport bus">🚌</div>
  </div>

  <div class="loading-text">PREPARING YOUR JOURNEY</div>

</div>
<script>
  // Redirect after 3 seconds
  setTimeout(() => {
    window.location.href = "home.html";
  }, 3000);
</script>
</body>
</html>
